[pytest]
# без этого `app` виден только при запуске `python -m pytest` (тот вставляет
# cwd в sys.path сам) — голый `pytest`, как его вызывает верификатор
# автопилота, cwd не вставляет и падает ImportError на "No module named 'app'"
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
