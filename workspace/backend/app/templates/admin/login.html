{% extends "admin/base.html" %}
{% block title %}Вход — TUR TUK админка{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="card" style="max-width: 360px; margin: 40px auto;">
    <h1 style="font-size: 18px; margin-top: 0;">Вход для персонала</h1>
    <p class="muted" style="font-size: 13px;">
        Код приходит тем же способом, что и обычным пользователям приложения.
    </p>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/login">
        <label for="phone">Телефон</label>
        <input id="phone" name="phone" type="tel" placeholder="+7..." required>

        <label for="code">Код из SMS</label>
        <input id="code" name="code" type="text" inputmode="numeric" required>

        <button type="submit">Войти</button>
    </form>
</div>
{% endblock %}
