{% extends "admin/base.html" %}
{% block title %}{{ "Изменить категорию" if category else "Новая категория" }} — TUR TUK админка{% endblock %}
{% block content %}
<style>
    select {
        display: block; width: 100%; padding: 8px 10px; margin: 6px 0 14px;
        border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
</style>

<div class="card" style="max-width: 480px;">
    <h1 style="font-size: 18px; margin-top: 0;">{{ "Изменить категорию" if category else "Новая категория" }}</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post" action="{{ form_action }}">
        <label for="name">Название</label>
        <input id="name" name="name" type="text" value="{{ category.name if category else '' }}" required>

        <label for="parent_id">Родительская категория</label>
        <select id="parent_id" name="parent_id">
            <option value="">Без родителя</option>
            {% for parent in categories %}
            <option value="{{ parent.id }}" {% if category and category.parent_id == parent.id %}selected{% endif %}>{{ parent.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">{{ "Сохранить" if category else "Добавить" }}</button>
        <a class="button" href="/admin/categories" style="background: transparent; color: var(--bordo); margin-left: 8px;">Отмена</a>
    </form>
</div>
{% endblock %}
