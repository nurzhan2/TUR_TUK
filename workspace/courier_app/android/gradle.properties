# Полоса build держит до 3 параллельных сессий Claude Code на одной машине с
# 16 ГБ RAM; -Xmx8G на процесс однажды не смог стартовать демон Gradle из-за
# нехватки страничного файла при параллельной нагрузке. Сборка courier_app
# маленькая, 2G/1G хватает с запасом.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Рабочий каталог этой машины лежит под "Помощник" — путь с кириллицей.
# AGP по умолчанию отказывается собирать проект по такому пути (см.
# http://b.android.com/95744), хотя фактически сборка проходит нормально.
# Отключаем именно эту проверку, а не обходим её переносом каталога.
android.overridePathCheck=true
# Проект не использует нативный (JNI/NDK) код и не должен зависеть от NDK.
# По умолчанию AGP всё равно пытается СКАЧАТЬ NDK версии flutter.ndkVersion
# при конфигурации проекта, даже если он не нужен ни одной задаче сборки.
# Локально NDK не установлен, а качать тулчейны в эту сессию запрещено —
# отключаем автозагрузку SDK-компонентов, а не тянем NDK.
android.builder.sdkDownload=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
