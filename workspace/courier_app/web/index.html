<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="TUR TUK Курьер — приложение курьера службы доставки в Кемере">
  <meta name="theme-color" content="#8B0000">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TUR TUK Курьер">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>TUR TUK Курьер</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #FFFFFF;
      transition: opacity .3s ease;
      z-index: 10;
    }
    #boot .mark {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: #8B0000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
    }
    #boot .name { font-size: 26px; font-weight: 800; color: #8B0000; }
    #boot .sub { font-size: 14px; color: #8A8A8E; }
    #boot.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">TT</div>
    <div class="name">TUR TUK Курьер</div>
    <div class="sub">Приложение курьера</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) {
        boot.classList.add('hidden');
        setTimeout(function () { boot.remove(); }, 320);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
