# Прод TUR TUK на одном VPS: PostgreSQL + API/админка + Caddy (HTTPS) + бэкапы.
#
#   cd deploy/prod
#   cp .env.example .env        # домен, пароли, ключи
#   docker compose up -d --build
#   docker compose exec api python -m app.cli create-owner --phone +7... --password '...'
#
# Подробно — deploy/prod/README.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turtuk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      POSTGRES_DB: turtuk
      # ICU-локаль: lower() и поиск без учёта регистра работают с кириллицей.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=und --locale=C"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turtuk -d turtuk"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://turtuk:${DB_PASSWORD}@db:5432/turtuk
      PUBLIC_BASE_URL: https://${DOMAIN}
      MEDIA_DIR: /app/media
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT_PATH:-}
    volumes:
      - media:/app/media
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Ежедневный pg_dump в volume backups, храним 14 дней.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/turtuk_$$(date +%Y-%m-%d_%H%M).sql.gz
          pg_dump -h db -U turtuk turtuk | gzip > "$$f" && echo "backup ok: $$f"
          find /backups -name 'turtuk_*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  db:
  media:
  backups:
  caddy_data:
  caddy_config:
