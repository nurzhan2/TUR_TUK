# Machine делит 16 ГБ ОЗУ с кучей другого (несколько claude-процессов,
# WSL, Chrome, Docker...) — унаследованные от шаблона -Xmx8G роняли
# демон Gradle в OutOfMemoryError (native malloc) при пике загрузки:
# свободно бывает ~900 МБ. Урезано до размера, которого хватает на
# assembleDebug маленького приложения без раздувания демона.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Рабочий каталог этой машины лежит под "Помощник" — путь с кириллицей.
# AGP по умолчанию отказывается собирать проект по такому пути (см.
# http://b.android.com/95744), хотя фактически сборка проходит нормально.
# Отключаем именно эту проверку, а не обходим её переносом каталога.
android.overridePathCheck=true
# NDK по умолчанию (и это НЕ помогает — оставлено как доп. слой защиты):
# настоящий фикс — `ndkVersion = ""` в android/app/build.gradle.kts,
# см. комментарий там же.
android.builder.sdkDownload=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
