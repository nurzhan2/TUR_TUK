name: client_app
description: "TUR TUK client app: доставка сувениров, косметики и продуктов в отели Кемера"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router: ^14.6.2
  intl: ^0.20.3

  # Состояние экранов — provider поверх ChangeNotifier: контракт задачи
  # (context.read<X>() / context.watch<X>()), и он же — самый дешёвый способ
  # раздать контроллеры без кодогенерации.
  provider: ^6.1.2
  # Сеть боевого режима. В демо не используется вовсе — ApiXxxRepository
  # поднимается только при kDemoMode=false.
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  # Карта в трекинге: flutter_map не требует API-ключа и работает на OSM,
  # в отличие от google_maps_flutter — для демо без бэкенда это решающее.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Контент от заказчицы: каталог, отели, настройки и фотографии товаров.
    # Складывается сюда скриптом tools/apply_content.py из workspace/content.
    - assets/content/
    - assets/content/photos/
    - assets/demo/
