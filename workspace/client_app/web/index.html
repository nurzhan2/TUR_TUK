<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Токен подставляет `flutter build web --base-href`, поэтому одна и та
       же сборка живёт и в корне домена, и в подпапке /client/. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="TUR TUK — доставка сувениров, косметики и продуктов в отели Кемера">
  <meta name="theme-color" content="#8B0000">

  <!-- iOS: заказчица открывает демо с айфона и добавляет на домашний экран.
       Без этих трёх строк оно запустится в Safari с адресной строкой и на
       приложение похоже не будет. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TUR TUK">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>TUR TUK — доставка в отели Кемера</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }
    /* Заставка на время загрузки движка: без неё первые пару секунд
       показывается пустой белый лист, и кажется, что ссылка битая. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #FFFFFF;
      transition: opacity .3s ease;
      z-index: 10;
    }
    #boot .mark {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: #8B0000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    #boot .name {
      font-size: 34px;
      font-weight: 800;
      color: #8B0000;
      letter-spacing: 1.5px;
    }
    #boot .sub {
      font-size: 15px;
      color: #8A8A8E;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">TT</div>
    <div class="name">TUR TUK</div>
    <div class="sub">Доставка в отели Кемера</div>
  </div>

  <script>
    // Прячем заставку, когда Flutter отрисовал первый кадр.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) {
        boot.classList.add('hidden');
        setTimeout(function () { boot.remove(); }, 320);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
